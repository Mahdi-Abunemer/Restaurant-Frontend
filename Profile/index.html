<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Main Page</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/prof.css">
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
</head>

<body>
    <!-- Navbar -->
    <div id="navbar-container"></div>
    <div class="profile-container">
        <div id="errorContainer" class="error-container"></div>
        <div class="form-header">
            <h1>User Profile</h1>
        </div>
        <form id="profileForm">
            <div class="input-group">
                <label class="input-label">Name</label>
                <input type="text" id="name" required>
                <div class="error-message" id="nameError"></div>
            </div>
            <div class="input-group">
                <label class="input-label">Birth Date</label>
                <input type="date" id="birthdate" required>
                <div class="error-message" id="birthdateError"></div>
            </div>
            <div class="input-group">
                <label class="input-label">Address</label>
                <input type="text" id="address" required>
                <div class="error-message" id="addressError"></div>
            </div>
            <div class="input-group">
                <label class="input-label">Phone</label>
                <input type="tel" id="phone" placeholder="+7 (xxx) xxx-xx-xx">
                <div class="error-message" id="phoneError"></div>
            </div>
            <div class="input-group">
                <label class="input-label">Email</label>
                <input type="email" id="email" readonly>
            </div>
            <div class="input-group">
                <label class="input-label">Gender</label>
                <input type="text" id="gender" readonly>
            </div>
            <button type="submit" class="btn-save">Save Changes</button>
        </form>
    </div>
    <!-- Load Scripts in This Order -->
    <script>
        fetch('../navbar.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navbar-container').innerHTML = html;
                initializeNavbar();
                if (typeof updateAuthButton === 'function') updateAuthButton();
                const script = document.createElement('script');
                script.src = 'prof.js';
                document.body.appendChild(script);
            })
            .catch(error => console.error('Navbar load error:', error));
    </script>
    <script src="../js/config.js"></script>
    <script src="../js/navbar.js"></script>
</body>

</html>
