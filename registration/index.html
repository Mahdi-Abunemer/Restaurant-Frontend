<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Main Page</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/reg.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="brand">
            <a href="../index.html" class="main-page-link">Food Delivery</a>
        </div>
    </nav>

    <div class="register-container">
        <div id="errorContainer" class="error-container"></div>
        <div class="form-header">
            <h1>Register New Account</h1>
        </div>

        <form id="registerForm">
            <div class="input-group">
                <label class="input-label">Name</label>
                <input type="text" id="name" required>
                <div class="error-message" id="nameError"></div>
            </div>

            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" id="password" required>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="input-group">
                <label class="input-label">Gender</label>
                <div class="select-wrapper">
                    <select id="gender" class="gender-select">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                    <i class='bx bx-chevron-down'></i>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Phone number</label>
                <input type="tel" id="phone" placeholder="+7 (xxx) xxx-xx-xx">
                <div class="error-message" id="phoneError"></div>
            </div>

            <div class="input-group">
                <label class="input-label">Date of birth</label>
                <input type="date" id="birthdate" required>
                <div class="error-message" id="birthdateError"></div>
            </div>

            <div class="input-group">
                <label class="input-label">Address</label>
                <input type="text" id="address" required>
                <div class="error-message" id="addressError"></div>
            </div>

            <div class="input-group">
                <label class="input-label">Email</label>
                <input type="email" id="email" required>
                <div class="error-message" id="emailError"></div>
            </div>

            <button type="submit" class="btn-signin">Register</button>

            <div class="login-link">
                <span>Already have an account? </span>
                <a href="../login/">Login</a>

            </div>
        </form>
    </div>
    <script src="../js/config.js"></script>
    <script src="reg.js"></script>
</body>

</html>
